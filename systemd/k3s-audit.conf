# k3s API-server audit logging (docs/reference/attack-lab.md).
#
# Why a drop-in and not /etc/rancher/k3s/config.yaml: k3s rewrites
# /etc/rancher/k3s/k3s.yaml on every start — it is the kubeconfig — and drops
# non-kubeconfig keys, so kube-apiserver-arg entries there do not survive a
# restart.
#
# Why /var/log/k3s-audit and not the k3s server directory: the audit log has to
# be readable by a log shipper and by the aisoc collector, while
# /var/lib/rancher/k3s/server also holds the node token and the cluster TLS
# keys. Giving those readers the whole directory to reach one log file would
# trade a visibility gap for a credential exposure.
#
# Install:
#   sudo install -m 0644 systemd/k3s-audit.conf \
#     /etc/systemd/system/k3s.service.d/audit.conf
#   sudo install -m 0644 k3s/audit-policy.yaml /etc/rancher/k3s/audit-policy.yaml
#   sudo systemctl daemon-reload && sudo systemctl restart k3s
[Service]
# k3s writes the log file but not its directory, and refuses to start without it.
ExecStartPre=/usr/bin/install -d -m 0750 -o root -g root /var/log/k3s-audit
ExecStart=
ExecStart=/usr/local/bin/k3s server \
  --write-kubeconfig /etc/rancher/k3s/kubeconfig \
  --write-kubeconfig-mode 640 \
  --write-kubeconfig-group aisoc \
  --kube-apiserver-arg=audit-log-path=/var/log/k3s-audit/audit.log \
  --kube-apiserver-arg=audit-log-maxage=7 \
  --kube-apiserver-arg=audit-log-maxbackup=3 \
  --kube-apiserver-arg=audit-log-maxsize=100 \
  --kube-apiserver-arg=audit-policy-file=/etc/rancher/k3s/audit-policy.yaml
